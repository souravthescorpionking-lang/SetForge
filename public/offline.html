<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · SetForge</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #141210;
    color: #fafaf9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 400px;
    width: 100%;
    text-align: center;
    background: #1e1b18;
    border: 1px solid #2e2a26;
    border-radius: 24px;
    padding: 48px 28px;
  }
  .flame {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    background: #f97316;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(249, 115, 22, 0.35);
  }
  .flame svg { width: 34px; height: 34px; fill: #fff7ed; }
  h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
  p { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #a8a29e; }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: #f97316;
    color: #fff7ed;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .hint { margin-top: 14px; font-size: 12px; color: #78716c; }
</style>
</head>
<body>
  <main class="card">
    <div class="flame" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>SetForge can't reach the server right now. If you've opened the app before, your data loads from the offline cache — reconnect and everything you log will sync.</p>
    <button onclick="location.replace('/')">Try again</button>
    <p class="hint">SetForge · Forge every set</p>
  </main>
  <script>
    window.addEventListener('online', () => location.replace('/'));
  </script>
</body>
</html>
